<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Agenda Compras | Agenda Comprador</title>


    <!-- =====================================================
         CSS GERAL
    ====================================================== -->

    <link
        rel="stylesheet"
        href="../../assets/css/style.css"
    >


    <!-- =====================================================
         CSS ESPECÍFICO DA AGENDA
    ====================================================== -->

    <link
        rel="stylesheet"
        href="../../assets/css/agenda.css"
    >

</head>


<body>


<div class="app">


    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside
        class="sidebar"
        id="sidebar"
    >


        <div class="sidebar-header">


            <div class="sidebar-logo">

                <img
                    src="../../assets/img/logo.png"
                    alt="Logo"
                >

            </div>


            <div class="sidebar-title">

                <strong>
                    AGENDA COMPRADOR
                </strong>

                <span>
                    Gestão inteligente de compras
                </span>

            </div>


        </div>



        <!-- =================================================
             NAVEGAÇÃO
        ================================================== -->

        <nav class="sidebar-navigation">


            <a
                href="../../index.html"
                class="nav-item"
            >

                <span class="nav-icon">
                    ⌂
                </span>

                <span>
                    Inicial
                </span>

            </a>



            <a
                href="agenda.html"
                class="nav-item active"
            >

                <span class="nav-icon">
                    ▣
                </span>

                <span>
                    Agenda Compras
                </span>

            </a>



            <a
                href="../agenda-ruptura/ruptura.html"
                class="nav-item"
            >

                <span class="nav-icon">
                    !
                </span>

                <span>
                    Agenda por Ruptura
                </span>

            </a>



            <a
                href="../configuracoes/configuracoes.html"
                class="nav-item"
            >

                <span class="nav-icon">
                    ⚙
                </span>

                <span>
                    Configurações
                </span>

            </a>


        </nav>



        <!-- =================================================
             RODAPÉ
        ================================================== -->

        <div class="sidebar-footer">


            <a
                href="../../login.html"
                class="nav-item logout-button"
            >

                <span class="nav-icon">
                    ↪
                </span>

                <span>
                    Sair
                </span>

            </a>


        </div>


    </aside>



    <!-- =====================================================
         CONTEÚDO PRINCIPAL
    ====================================================== -->

    <main class="main-content">


        <!-- =================================================
             TOPBAR
        ================================================== -->

        <div class="topbar">


            <div class="topbar-left">

                <button
                    type="button"
                    class="mobile-menu-button"
                    id="menuToggle"
                    aria-label="Abrir menu"
                >
                    ☰
                </button>

            </div>



            <div class="topbar-right">


                <button
                    type="button"
                    class="notification-button"
                    aria-label="Notificações"
                >

                    🔔

                    <small>
                        3
                    </small>

                </button>


                <div class="user-area">


                    <div class="user-avatar">
                        M
                    </div>


                    <div class="user-info">

                        <strong>
                            Marcos
                        </strong>

                        <span>
                            Comprador
                        </span>

                    </div>


                </div>


            </div>


        </div>



        <!-- =================================================
             PÁGINA
        ================================================== -->

        <section class="page agenda-page">


            <!-- =================================================
                 CABEÇALHO
            ================================================== -->

            <div class="page-heading agenda-heading">


                <div>

                    <span class="section-label">
                        AGENDA COMPRAS
                    </span>


                    <h1>
                        Minha agenda
                    </h1>


                    <p>
                        Organize seus fabricantes e acompanhe sua programação de compras.
                    </p>

                </div>


                <button
                    type="button"
                    class="agenda-new-button"
                    id="newAppointmentButton"
                >
                    + Novo agendamento
                </button>


            </div>



            <!-- =================================================
                 BARRA DA AGENDA
            ================================================== -->

            <div class="agenda-toolbar">


                <!-- =================================================
                     NAVEGAÇÃO DE PERÍODO
                ================================================== -->

                <div class="agenda-period-navigation">


                    <button
                        type="button"
                        class="agenda-nav-button"
                        id="previousPeriod"
                        aria-label="Período anterior"
                    >
                        ‹
                    </button>


                    <div class="agenda-period-title">

                        <strong
                            id="periodTitle"
                        >
                            Outubro 2026
                        </strong>

                    </div>


                    <button
                        type="button"
                        class="agenda-nav-button"
                        id="nextPeriod"
                        aria-label="Próximo período"
                    >
                        ›
                    </button>


                </div>



<div class="agenda-toolbar-actions">


    <!-- =================================================
         HOJE
    ================================================== -->

    <button
        type="button"
        class="agenda-today-button"
        id="todayButton"
    >
        Hoje
    </button>



    <!-- =================================================
         FILTRO — GRUPO
    ================================================== -->

    <div
        class="agenda-filter-dropdown"
        data-filter="group"
    >

        <button
            type="button"
            class="agenda-filter-trigger"
            data-filter-trigger="group"
            aria-expanded="false"
        >

            <span>
                Grupo
            </span>

            <strong
                data-filter-label="group"
            >
                Todos
            </strong>

            <span class="agenda-filter-arrow">
                ▾
            </span>

        </button>


        <div
            class="agenda-filter-menu"
            data-filter-menu="group"
        >

            <div
                class="agenda-filter-options"
                id="groupFilterOptions"
            ></div>

        </div>

    </div>



<!-- =================================================
     FILTRO — CLASSIFICAÇÃO
================================================== -->

<div class="agenda-classification-filter">

    <div
        class="agenda-filter-dropdown"
        data-filter="classification"
    >

        <button
            type="button"
            class="agenda-filter-trigger"
            data-filter-trigger="classification"
            aria-expanded="false"
        >

            <span>
                Classificação
            </span>

            <strong
                data-filter-label="classification"
            >
                Todas
            </strong>

            <span class="agenda-filter-arrow">
                ▾
            </span>

        </button>


        <div
            class="agenda-filter-menu classification-menu"
            data-filter-menu="classification"
        >

            <div
                class="agenda-filter-options"
                id="classificationFilterOptions"
            ></div>

        </div>

    </div>


    <!-- =================================================
         MODO DE EXIBIÇÃO DAS CLASSIFICAÇÕES
    ================================================== -->

    <button
        type="button"
        class="agenda-classification-mode-button"
        id="classificationModeButton"
        aria-label="Agrupar classificações"
        aria-pressed="false"
        title="Agrupar classificações"
    >

        <span
            id="classificationModeIcon"
            aria-hidden="true"
        >
            ⧉
        </span>

    </button>

</div>



    <!-- =================================================
         FILTRO — SITUAÇÃO
    ================================================== -->

    <div
        class="agenda-filter-dropdown"
        data-filter="situation"
    >

        <button
            type="button"
            class="agenda-filter-trigger"
            data-filter-trigger="situation"
            aria-expanded="false"
        >

            <span>
                Situação
            </span>

            <strong
                data-filter-label="situation"
            >
                Todas
            </strong>

            <span class="agenda-filter-arrow">
                ▾
            </span>

        </button>


        <div
            class="agenda-filter-menu"
            data-filter-menu="situation"
        >

            <div class="agenda-filter-options">


                <label class="agenda-filter-option">

                    <input
                        type="checkbox"
                        name="situationFilter"
                        value="all"
                        checked
                    >

                    <span class="agenda-filter-check"></span>

                    <span class="agenda-filter-option-text">
                        Todas as situações
                    </span>

                </label>


                <label class="agenda-filter-option">

                    <input
                        type="checkbox"
                        name="situationFilter"
                        value="normal"
                    >

                    <span class="agenda-filter-check"></span>

                    <span class="agenda-filter-option-text">
                        Normal
                    </span>

                </label>


                <label class="agenda-filter-option">

                    <input
                        type="checkbox"
                        name="situationFilter"
                        value="attention"
                    >

                    <span class="agenda-filter-check"></span>

                    <span class="agenda-filter-option-text">
                        Atenção
                    </span>

                </label>


                <label class="agenda-filter-option">

                    <input
                        type="checkbox"
                        name="situationFilter"
                        value="urgent"
                    >

                    <span class="agenda-filter-check"></span>

                    <span class="agenda-filter-option-text">
                        Urgente
                    </span>

                </label>


                <label class="agenda-filter-option">

                    <input
                        type="checkbox"
                        name="situationFilter"
                        value="risk"
                    >

                    <span class="agenda-filter-check"></span>

                    <span class="agenda-filter-option-text">
                        Risco de ruptura
                    </span>

                </label>


            </div>

        </div>

    </div>



    <!-- =================================================
         VISUALIZAÇÃO
    ================================================== -->

    <div class="agenda-view-switcher">


        <button
            type="button"
            class="agenda-view-button active"
            data-view="month"
        >
            Mês
        </button>


        <button
            type="button"
            class="agenda-view-button"
            data-view="week"
        >
            Semana
        </button>


        <button
            type="button"
            class="agenda-view-button"
            data-view="day"
        >
            Dia
        </button>


    </div>


</div>


            </div>



            <!-- =================================================
                 CONTEÚDO
            ================================================== -->

            <div class="agenda-content">


                <!-- =================================================
                     MÊS
                ================================================== -->

                <section
                    class="agenda-view active"
                    id="monthView"
                >

                    <div
                        class="month-calendar"
                        id="monthCalendar"
                    ></div>

                </section>



                <!-- =================================================
                     SEMANA
                ================================================== -->

                <section
                    class="agenda-view"
                    id="weekView"
                >

                    <div
                        class="week-calendar"
                        id="weekCalendar"
                    ></div>

                </section>



                <!-- =================================================
                     DIA
                ================================================== -->

                <section
                    class="agenda-view"
                    id="dayView"
                >

                    <div
                        class="day-view-container"
                        id="dayCalendar"
                    ></div>

                </section>


            </div>


        </section>


    </main>



    <!-- =====================================================
         OVERLAY MOBILE
    ====================================================== -->

    <div
        class="sidebar-overlay"
        id="sidebarOverlay"
    ></div>


</div>



<!-- =====================================================
     JS GERAL
====================================================== -->

<script src="../../assets/js/app.js"></script>


<!-- =====================================================
     JS DA AGENDA
====================================================== -->

<script src="../../assets/js/agenda.js"></script>


</body>

</html>
